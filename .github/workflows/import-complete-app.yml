name: Import complete Kingdom Manager

on:
  push:
    paths:
      - ".github/workflows/import-complete-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the complete current data set
        working-directory: source
        shell: bash
        run: |
          mkdir -p public/workbook-media
          base="https://pathfinder-kingdom-manager.imolinamuntanola.chatgpt.site"
          for file in rules-data.json workbook-model.json formula-verification.json workbook-images.json favicon.svg; do
            curl --fail --location --retry 3 "$base/$file" --output "public/$file"
          done
          for number in $(seq 1 102); do
            curl --fail --location --retry 3 "$base/workbook-media/image${number}.png" --output "public/workbook-media/image${number}.png"
          done
      - name: Build the independent GitHub Pages application
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npm run build
          mv github-dist/github-index.html github-dist/index.html
      - name: Replace the temporary redirect
        shell: bash
        run: |
          rm -f index.html app.js styles.css
          cp -R source/github-dist/. .
          printf 'GitHub Pages static application\n' > .nojekyll
      - name: Store the complete application in GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish complete Kingdom Manager on GitHub Pages"
          git push
